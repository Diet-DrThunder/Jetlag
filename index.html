<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jet Lag: Hide + Seek, Rattan Creek</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rubik:wght@800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#12203a;--sky:#e9f2fb;--yel:#ffd23f}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:18px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--sky)}
h2{font:800 22px/1.2 Rubik,system-ui,sans-serif;margin:8px 0 0}
.bar{background:var(--ink);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
.logo{font:800 30px/1 Rubik,system-ui,sans-serif;color:var(--yel)}
.sub{font-size:16px;color:#cfe0f5}
.badge{background:var(--yel);color:var(--ink);border-radius:99px;padding:4px 14px;font-weight:700}
.stripe{height:7px;background:linear-gradient(90deg,#2a6fdb 20%,#d62839 20% 40%,#0f7b5c 40% 60%,#7336d6 60% 80%,#ff9f1c 80%)}
.tabs{display:flex;gap:8px;padding:8px;background:#fff;border-bottom:3px solid var(--ink);overflow-x:auto}
.tab{flex:1;padding:10px 14px;font:700 19px "Atkinson Hyperlegible",system-ui,sans-serif;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.tab.on{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.card>summary{padding:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:20px;cursor:pointer;list-style:none;border-radius:11px}
.card>summary::-webkit-details-marker{display:none}
.card .body{padding:2px 14px 14px}
.card .body>*+*{margin-top:10px}
.sm{font-size:16px;color:#3b4a66;font-weight:400}
.chev{display:inline-block;transition:transform .15s;margin-right:6px}
details[open]>summary .chev{transform:rotate(90deg)}
.btn{min-height:50px;padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:700 18px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink)}
.btn.on{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.tool{color:#fff;font-size:20px}
.tool.dim{opacity:.5}
.say{background:var(--yel);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:20px}
.panel{background:#fff;border-top:3px solid var(--ink);padding:10px;display:grid;gap:10px;overflow-y:auto;max-height:54%;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gone{display:none!important}
.pin{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);color:#fff;font:800 14px/24px Rubik,sans-serif;text-align:center}
.sec{position:absolute;inset:0;overflow-y:auto;padding:14px}
.sec>div{max-width:640px;margin:0 auto;display:grid;gap:14px}
.p3{padding:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:17px}
#map{flex:1;min-height:180px}
input{font:inherit;border:3px solid var(--ink);border-radius:10px;padding:8px 10px}
</style>
</head>
<body>
<header class="bar">
  <div><div class="logo">JET LAG</div><div class="sub">Hide + Seek &middot; Rattan Creek</div></div>
  <span class="badge" id="hdrNote"></span>
</header>
<div class="stripe"></div>
<nav class="tabs">
  <button class="tab on" data-t="map">Map</button>
  <button class="tab" data-t="seek">Seeker</button>
  <button class="tab" data-t="hide">Hider</button>
  <button class="tab" data-t="rules">Rules</button>
  <button class="tab" data-t="log">Log</button>
</nav>

<main style="flex:1;min-height:0;position:relative">
  <section id="tab-map" class="sec" style="padding:0;display:flex;flex-direction:column">
    <div id="map"></div>
    <div class="panel">
      <div class="g2" id="tools"></div>
      <div class="say" id="say"></div>
      <div class="sm">The hider's answer:</div>
      <div class="g2"><button class="btn" id="aY"></button><button class="btn" id="aN"></button></div>
      <div id="radRow" class="row">
        <span class="sm w-full">Radar distance:</span>
        <span id="presets" class="row"></span>
        <label class="sm">or custom <input id="rCustom" type="number" min="0.05" step="0.05" style="width:80px"> miles</label>
      </div>
      <div class="row">
        <button class="btn gone" id="fin" style="background:#0f7b5c;color:#fff">Finish matching</button>
        <button class="btn gone" id="cancel">Start over</button>
        <button class="btn" id="gps">Use my location</button>
        <button class="btn" id="fit">Fit game area</button>
        <button class="btn" id="bndT">Boundary</button>
        <button class="btn" id="clearP">Clear all</button>
      </div>
      <details>
        <summary class="sm" style="cursor:pointer"><span class="chev">&#9656;</span>Boundary looks off? Nudge it</summary>
        <div class="row" style="padding-top:8px">
          <button class="btn" data-n="0,1">North</button><button class="btn" data-n="0,-1">South</button>
          <button class="btn" data-n="-1,0">West</button><button class="btn" data-n="1,0">East</button>
          <button class="btn" data-n="reset">Reset</button>
        </div>
      </details>
      <div class="sm row" style="gap:14px">
        <span><b style="color:#d4a800">&#9644;</b> hide here OK</span>
        <span><b style="color:#d62839">&#9644;</b> no hiding</span>
        <span><b style="color:#d62839">&#9632;</b> eliminated</span>
      </div>
      <div id="pingList" style="display:grid;gap:8px"></div>
    </div>
  </section>

  <section id="tab-seek" class="sec gone"><div id="seekBody"></div></section>
  <section id="tab-hide" class="sec gone"><div id="hideBody"></div></section>
  <section id="tab-rules" class="sec gone"><div id="rulesBody"></div></section>
  <section id="tab-log" class="sec gone">
    <div>
      <div class="row" style="flex-wrap:nowrap"><input id="logIn" placeholder="Add a note..." style="flex:1;min-width:0"><button class="btn" id="logAdd">Add</button></div>
      <div id="logList" style="display:grid;gap:8px"></div>
      <div class="row"><button class="btn" id="logClear">Clear log</button><button class="btn" id="resetAll" style="color:#d62839">Reset whole game</button></div>
    </div>
  </section>
</main>

<script>
/* ---------- GAME CONTENT (from the Google Site) ---------- */
const SCH=['Pond Springs','Jollyville','Challenger Pond Springs','Live Oak Elementary'];
const GAS=['8000 Anderson Mill Rd, Austin, TX 78729 (7-Eleven)','6107 W Parmer Ln, Austin, TX 78729 (Circle K)','8925 Anderson Mill Rd, Austin, TX 78729 (Sunrise Mini Mart)','13201 Pond Springs Rd, Austin, TX 78729 (Shell)'];
const APT=['7920 San Felipe Blvd, Austin, TX 78729 (Flats on San Felipe)','8601 Anderson Mill Rd, Austin, TX 78729 (Bexley)','7011 W Parmer Ln, Austin, TX 78729 (Oakville)','12800 Turtle Rock Rd, Austin, TX 78729 (Villages at Turtle Rock)'];
const PARK=['7617 Elkhorn Mountain Trail, Austin, TX 78729 (Rattan)','12400 Hunters Chase Dr, Austin, TX 78729 (Hunter\'s Chase)','13308 Humphrey Dr, Austin, TX 78729 (Robinson)'];
const SEEK=[
 {n:'Radar',q:'Are you within X distance from me?',t:5,c:'Draw 2, Pick 1',o:{'Distance':['250 yards','1/4 mile','1/2 mile','1 mile']}},
 {n:'Thermometer',q:'I have just travelled X distance, am I hotter or colder?',t:3,c:'Draw 2, Pick 1',o:{'Distance':['1/2 mile','1/4 mile','250 yards']}},
 {n:'Matching',q:'Is your nearest ____ the same as my nearest ____?',t:5,c:'Draw 3, Pick 1',note:'Measure from the name on Google Maps.',o:{'Street':[],'School':SCH,'Gas Station':GAS,'Apartment Complex':APT,'Park':PARK}},
 {n:'Measuring',q:'Are you closer or further from a ____ than me?',t:5,c:'Draw 3, Pick 1',note:'Measure from the name on Google Maps.',o:{'School':SCH,'Gas Station':GAS,'Apartment Complex':APT,'Park':PARK}},
 {n:'Photos',q:'Send a photo of (subject).',t:5,c:'Draw 1',note:'All objects must be within the hiding zone.',o:{'Subjects':['A Tree: must include the entire tree','The Sky: place phone on the ground and shoot straight up, no zoom','You: selfie mode, arm parallel to the ground, fully extended','Tallest Structure in Your Sightline: must include the top, and the top must be in the top 1/3 of the frame','A Sidewalk: must include the full width of the sidewalk and at least 1 driveway','A Trash Can: must include the entire can, the top, and two sides']}}
];
const DRAW=[[1,25,'2 Minute Time Bonus'],[26,40,'4 Minute Time Bonus'],[41,50,'6 Minute Time Bonus'],[51,53,'8 Minute Time Bonus'],[54,55,'12 Minute Time Bonus'],[56,59,'Randomize Question'],[60,63,'Veto Question'],[64,65,'Duplicate Card'],[66,66,'MOVE (see Move card below)'],[67,70,'Discard 1, Draw 2'],[71,74,'Discard 2, Draw 3'],[75,76,'Draw 1, Expand 1 (raises max hand size by 1)'],[77,100,'CURSE: roll 1-13 below']];
const CURSES=[
 ['Ransom Note','The next question the seekers ask must be composed of words and letters cut out of any printed material. It must be coherent and include at least 5 words.','Spell out "curse of the ransom note" as a ransom note.'],
 ['Drained Brain','Choose three questions in different categories. The seekers cannot ask those questions for the rest of your run.','Discard your hand.'],
 ['Gambler\'s Feet','For the next five minutes, seekers must roll a die before they take any steps in any direction. They may take that many steps before rolling again.','Roll a die. If it\'s even, this curse has no effect.'],
 ['Fish out of Water','The seeker must ask their next question from within 250 ft of a non-chlorinated body of water, of any size.','Seekers must be at least 1/4 mile from you.'],
 ['Cairn','Stack as many rocks as you can in a freestanding tower (one attempt). Each rock may touch only one other rock; rocks can\'t be removed once added; the tower must stand 5 seconds before adding another. If any rock other than the base touches the ground, it has fallen. Tell the seekers how many rocks it held when it last stood 5 seconds. They must build a tower of that height under the same rules before asking another question; if theirs falls they restart. Rocks must be found in nature and dispersed afterward.','Build a rock tower.'],
 ['Mediocre Travel Agent','Choose any publicly accessible point of interest within a half mile of the seekers (they can\'t be on transit). They must go there and spend at least 5 minutes before asking another question, and bring you a souvenir. If the souvenir is lost before they give it to you, you get an extra 10 minutes.','Their destination must be further from you than their current location.'],
 ['Luxury Car','Take a photo of a car. The seekers must take a photo of a more expensive car before asking another question.','A photo of a car.'],
 ['Spotty Memory','For the rest of your run, one random question category is disabled at all times. After the curse is played, seekers roll a die to pick the disabled category. It stays disabled until the next question is asked, then they roll again. The same category can repeat.','Discard a time bonus card.'],
 ['Bird Guide','Film a bird for as long as possible, up to 15 minutes straight (one chance). If the bird leaves the frame, your timer stops. The seekers must film a bird for the same time or longer before asking another question. They may instead take a time penalty three times your recording, minimum 20 minutes, to skip the curse.','Film a bird.'],
 ['Frozen Dot','Place a point on the map at least 500 ft from where the seekers are standing. If in exactly 5 minutes they are within 150 ft of that point, you get a 25 minute time bonus.','Seekers must be at least 1/2 mile away.'],
 ['Zoologist','Take a photo of a wild fish, bird, mammal, reptile, amphibian, or bug. The seekers must photograph a wild animal in the same category before asking another question.','A photo of an animal.'],
 ['Right Turn','For the next hour, the seekers can only turn right at intersections. A right turn is any road that veers to their right; going straight is allowed. If they hit a dead end where they can\'t continue forward or turn right for another 500 ft, they may do a full 180.','Discard a curse and one other card.'],
 ['Hidden Hangman','Before asking another question, seekers must beat the hider at hangman. The hider picks a 5-letter word; the game ends on a correct word guess or 7 wrong letter guesses. The hider must respond to all queries within 30 seconds. Seekers can\'t challenge again for 3 minutes after a loss. After 3 losses, the seekers are released.','Discard a time bonus card.']
];
const RULES=[
 ['Hiding','You may hide along the yellow lines on the map, but not on the red lines. Anywhere in between is acceptable.'],
 ['Final location','Your final location at the end of the hiding period must be ON an accessible footpath or road. After that you may only move within 100 yards of that final location.'],
 ['Endgame','The endgame starts once a seeker is within 750 ft (0.14 miles) of you. From that point the hider may NOT move, and must tell the seeker.'],
 ['Cards','Text the seekers every card you play. Cards are announced when played, not when drawn.'],
 ['Drawing a card','Ask Google for a random number from 1 to 100 (or use the roller on the Hider tab) and use the table on the Hider tab. If you roll a curse and already have it, roll again.'],
 ['Move card','Discard your hand and send the seekers to your current location. You get 15 minutes to set up a new hiding zone elsewhere on the game map. Seekers are frozen and your hiding timer is paused until that period ends. It cannot be played during the endgame.']
];

/* ---------- STATE ---------- */
const K='jl-rattan-v1';
let S={items:[],log:[],off:[0,0],bnd:true,r:804.67,inside:true,tool:'radar'};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mi=m=>(m/1609.344).toFixed(2)+' mi';
const now=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function log(t){S.log.unshift({t:now(),x:t});save();renderLog()}

/* ---------- GEOMETRY (local flat plane in meters around the park) ---------- */
const C=[30.4497,-97.7570],KX=111320*Math.cos(C[0]*Math.PI/180),KY=110574;
const xy=p=>[(p[1]-C[1])*KX,(p[0]-C[0])*KY], ll=p=>[C[0]+p[1]/KY,C[1]+p[0]/KX];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function ring(lat,lng,r,n=72){const o=[];for(let i=0;i<n;i++){const b=2*Math.PI*i/n,R=6378137;
  o.push([lat+(r/R)*Math.cos(b)*180/Math.PI,lng+(r/R)*Math.sin(b)/Math.cos(lat*Math.PI/180)*180/Math.PI])}return o}
// keep the part of polygon P that is closer to F than to O (Sutherland-Hodgman)
function clip(P,d,c){const f=p=>2*(p[0]*d[0]+p[1]*d[1])-c,o=[];
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],fa=f(a),fb=f(b);
    if(fa<=0)o.push(a);
    if((fa<0&&fb>0)||(fa>0&&fb<0)){const t=fa/(fa-fb);o.push([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])])}}return o}
function cell(F,others){let P=[[-1e4,-1e4],[1e4,-1e4],[1e4,1e4],[-1e4,1e4]];
  others.forEach(O=>{P=clip(P,[O[0]-F[0],O[1]-F[1]],O[0]*O[0]+O[1]*O[1]-F[0]*F[0]-F[1]*F[1])});return P.map(ll)}
const box=()=>[[C[0]+.2,C[1]-.25],[C[0]+.2,C[1]+.25],[C[0]-.2,C[1]+.25],[C[0]-.2,C[1]-.25]];
if(S.pings){S.items=S.items.concat(S.pings.map(p=>({id:p.id,tool:'radar',inside:p.inside,pts:[[p.lat,p.lng]],region:ring(p.lat,p.lng,p.r),txt:mi(p.r)})));delete S.pings;save()}

/* ---------- MAP ---------- */
const PARK_LL=C;
const px=(x,y)=>[30.4510-(y-372)*0.0000225+S.off[1]*0.00009, -97.7618+(x-515)*0.000026+S.off[0]*0.0001];
const Y1=[[640,0],[660,50],[700,110],[735,170],[790,240],[830,290],[860,320],[905,350],[960,390],[1000,440],[1018,500],[1024,518]];
const R1=[[1024,518],[1000,535],[970,548]];
const Y2=[[970,548],[950,500],[930,455],[905,452],[895,465],[925,495],[935,515],[920,530],[880,540],[840,548],[805,565],[795,545],[800,500],[740,498],[735,540],[725,565],[690,580],[650,605],[610,630],[588,641]];
const R2=[[588,641],[560,650],[535,670],[525,705],[480,690],[430,700],[395,690],[360,685]];
const Y3=[[360,685],[348,640],[335,590],[280,585],[255,570],[230,540],[215,490],[210,440],[205,415],[235,395],[280,395],[310,405],[340,380],[360,355],[345,320],[375,310],[405,285],[425,235],[460,205],[475,195],[470,180]];
const R3=[[470,180],[437,95],[640,0]];
const SPUR=[[858,307],[900,258]];

const map=L.map('map').setView(PARK_LL,15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const bndG=L.layerGroup().addTo(map),itemG=L.layerGroup().addTo(map),pendG=L.layerGroup().addTo(map);
L.marker(PARK_LL).addTo(map).bindTooltip('Rattan Creek Park');

function drawBoundary(){
  bndG.clearLayers();if(!S.bnd)return;
  L.polygon([].concat(Y1,R1,Y2,R2,Y3,R3).map(p=>px(...p)),{stroke:false,fillColor:'#2a6fdb',fillOpacity:.07,interactive:false}).addTo(bndG);
  [[Y1,'#ffc400'],[R1,'#d62839'],[Y2,'#ffc400'],[R2,'#d62839'],[Y3,'#ffc400'],[R3,'#d62839'],[SPUR,'#d62839']].forEach(([pts,col])=>
    L.polyline(pts.map(p=>px(...p)),{color:col,weight:6,opacity:.95,interactive:false}).addTo(bndG));
}

/* ---------- QUESTION TOOLS ---------- */
const T={
 radar:{n:'Radar',c:'#2a6fdb',a:['Yes, within','No, not within'],L:['S']},
 thermo:{n:'Thermometer',c:'#d62839',a:['Hotter','Colder'],L:['A','B']},
 match:{n:'Matching',c:'#0f7b5c',a:['Same','Different'],L:[]},
 measure:{n:'Measuring',c:'#7336d6',a:['Closer','Further'],L:['P','S']}
};
let tmp=[];
const pin=(p,t,c)=>L.marker(p,{interactive:false,icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:`<div class="pin" style="background:${c}">${t}</div>`})});
const lab=(k,j)=>T[k].L[j]||String(j+1);
function say(){const k=S.tool,n=tmp.length;
  return k==='radar'?'Tap the map where the seekers are standing.':
   k==='thermo'?(n?'Now tap where the seekers ended up (B).':'Tap where the seekers started (A).'):
   k==='match'?(n?`Tap each other place in the same category, then press Finish (${n} placed).`:'Tap the seekers\' nearest place (1).'):
   (n?'Now tap where the seekers are standing.':'Tap the place being measured to (a park, school, etc).')}
function syncUI(){const t=T[S.tool],n=tmp.length;
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('dim',b.dataset.k!==S.tool));
  $('say').textContent=say();
  $('aY').textContent=t.a[0];$('aN').textContent=t.a[1];
  $('aY').classList.toggle('on',S.inside);$('aN').classList.toggle('on',!S.inside);
  $('radRow').classList.toggle('gone',S.tool!=='radar');
  $('fin').classList.toggle('gone',!(S.tool==='match'&&n>=2));
  $('cancel').classList.toggle('gone',!n);
  [...$('presets').children].forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.r-S.r)<1));
  $('bndT').classList.toggle('on',S.bnd)}
function drawTmp(){pendG.clearLayers();tmp.forEach((p,j)=>pin(p,lab(S.tool,j),'#12203a').addTo(pendG))}
function tap(p){tmp.push(p);const k=S.tool;
  if((k==='radar'&&tmp.length===1)||((k==='thermo'||k==='measure')&&tmp.length===2))commit();else drawTmp();
  syncUI()}
function commit(){const k=S.tool,P=tmp.map(xy);let region,txt;
  if(k==='radar'){region=ring(tmp[0][0],tmp[0][1],S.r);txt=mi(S.r)}
  else if(k==='thermo'){region=cell(P[1],[P[0]]);txt=mi(dist(P[0],P[1]))+' walked'}
  else if(k==='match'){region=cell(P[0],P.slice(1));txt=tmp.length+' places'}
  else{const r=dist(P[0],P[1]);region=ring(tmp[0][0],tmp[0][1],r,90);txt=mi(r)+' away'}
  S.items.push({id:Date.now(),tool:k,inside:S.inside,pts:tmp,region,txt});
  log(`${T[k].n}: ${T[k].a[S.inside?0:1]} (${txt})`);
  tmp=[];pendG.clearLayers();save();draw();renderItems();syncUI()}
function draw(){itemG.clearLayers();
  S.items.forEach((it,i)=>{const c=T[it.tool].c;
    L.polygon(it.inside?[box(),it.region]:it.region,{stroke:false,fillColor:'#d62839',fillOpacity:it.inside?.24:.3,interactive:false}).addTo(itemG);
    L.polygon(it.region,{color:c,weight:4,fill:false,dashArray:it.inside?'10 8':null,bubblingMouseEvents:false}).addTo(itemG)
      .bindPopup(`<b>#${i+1} ${T[it.tool].n}</b><br>${T[it.tool].a[it.inside?0:1]}<br><button onclick="delItem(${it.id})" style="color:#d62839;font-weight:700;font-size:16px">Delete</button>`);
    if(it.tool==='thermo')L.polyline(it.pts,{color:c,weight:3,interactive:false}).addTo(itemG);
    it.pts.forEach((p,j)=>pin(p,lab(it.tool,j),c).addTo(itemG))})}
window.delItem=id=>{S.items=S.items.filter(p=>p.id!==id);save();map.closePopup();draw();renderItems();log('Deleted an answer from the map')};
function renderItems(){
  $('pingList').innerHTML=S.items.length?S.items.map((it,i)=>`<div class="item" style="border-left:12px solid ${T[it.tool].c}">
    <span><b>${i+1}. ${T[it.tool].n}</b><br>${T[it.tool].a[it.inside?0:1]} <span class="sm">${esc(it.txt)}</span></span>
    <span class="row"><button class="btn" style="min-height:44px" onclick="map.setView([${it.pts[0][0]},${it.pts[0][1]}],16)">Go</button><button class="btn" style="min-height:44px" onclick="delItem(${it.id})">Delete</button></span></div>`).join(''):
    '<div class="sm">Nothing on the map yet. Pick a question, set the hider\'s answer, then tap the map.</div>';
  $('hdrNote').textContent=S.items.length+(S.items.length===1?' answer':' answers')}

$('tools').innerHTML=Object.keys(T).map(k=>`<button class="btn tool" data-k="${k}" style="background:${T[k].c}">${T[k].n}</button>`).join('');
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{S.tool=b.dataset.k;tmp=[];drawTmp();save();syncUI()});
[['250 yd',228.6],['1/4 mi',402.34],['1/2 mi',804.67],['1 mi',1609.34]].forEach(([l,r])=>{
  const b=document.createElement('button');b.className='btn';b.textContent=l;b.dataset.r=r;
  b.onclick=()=>{S.r=r;$('rCustom').value='';save();syncUI()};$('presets').appendChild(b)});
$('rCustom').oninput=e=>{const v=parseFloat(e.target.value);if(v>0){S.r=v*1609.344;save();syncUI()}};
$('aY').onclick=()=>{S.inside=true;save();syncUI()};
$('aN').onclick=()=>{S.inside=false;save();syncUI()};
$('fin').onclick=commit;
$('cancel').onclick=()=>{tmp=[];drawTmp();syncUI()};
$('bndT').onclick=()=>{S.bnd=!S.bnd;save();drawBoundary();syncUI()};
$('fit').onclick=()=>map.fitBounds(L.latLngBounds([].concat(Y1,R1,Y2,R2,Y3,R3).map(p=>px(...p))).pad(.05));
$('clearP').onclick=()=>{if(S.items.length&&confirm('Remove everything from the map?')){S.items=[];tmp=[];drawTmp();save();draw();renderItems();syncUI();log('Cleared the map')}};
$('gps').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(
  pos=>{const p=[pos.coords.latitude,pos.coords.longitude];map.setView(p,16);tap(p)},
  ()=>alert('Could not get your location. Allow location access and try again.')):alert('Location is not available on this device.');
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
  if(b.dataset.n==='reset')S.off=[0,0];else{const[a,c]=b.dataset.n.split(',').map(Number);S.off=[S.off[0]+a,S.off[1]+c]}
  save();drawBoundary()});
map.on('click',e=>tap([e.latlng.lat,e.latlng.lng]));

/* ---------- CONTENT TABS ---------- */
const det=(title,body,sub='',col='#12203a')=>`<details class="card"><summary style="border-left:14px solid ${col}"><b><span class="chev">&#9656;</span>${title}</b><span class="sm">${sub}</span></summary><div class="body">${body}</div></details>`;
const SC={Radar:'#2a6fdb',Thermometer:'#d62839',Matching:'#0f7b5c',Measuring:'#7336d6',Photos:'#ff9f1c'};
$('seekBody').innerHTML='<p class="sm">Tap a question to see its options. Log the answer on the Map tab.</p>'+SEEK.map(s=>
  det(s.n,`<p><b>${esc(s.q)}</b></p>${s.note?`<p class="sm">${esc(s.note)}</p>`:''}`+
  Object.entries(s.o).map(([k,v])=>`<div><b>${k}</b>${v.length?'<ul style="margin:4px 0 0 22px;list-style:disc">'+v.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}</div>`).join(''),
  `${s.t} min &middot; ${s.c}`,SC[s.n])).join('');

$('hideBody').innerHTML=`<p class="sm">Text the seekers every card you play. Cards are announced when played, not when drawn.</p>
 <div class="card p3" style="background:var(--yel);display:grid;gap:10px"><h2 style="margin:0">Draw a card</h2>
  <button class="btn" id="roll" style="background:#12203a;color:#fff;font-size:22px;min-height:60px">Roll 1-100</button><div id="rollOut"></div></div>`+
 det('Card table',`<table style="width:100%">${DRAW.map(r=>`<tr style="border-top:2px solid #d5deea"><td style="padding:6px 12px 6px 0;white-space:nowrap;font-weight:700">${r[0]===r[1]?r[0]:r[0]+'-'+r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`)+
 det('Move card',`<p>${RULES[5][1]}</p>`,'roll 66','#ff9f1c')+
 '<h2>Curses</h2><p class="sm">Roll 1-13. If you already have that curse, roll again.</p>'+
 '<button class="btn" id="rollC" style="background:#d62839;color:#fff;font-size:22px;min-height:60px">Roll a curse</button><div id="curseOut"></div>'+
 CURSES.map((c,i)=>det(`${i+1}. ${c[0]}`,`<p>${esc(c[1])}</p><p><b>Casting cost:</b> ${esc(c[2])}</p>`,'','#d62839')).join('');
const rnd=n=>1+Math.floor(Math.random()*n);
function showCurse(){const i=rnd(13),c=CURSES[i-1];
  $('curseOut').innerHTML=`<div class="card p3" style="margin-top:12px;border-color:#d62839"><h2 style="margin:0">${i}. ${c[0]}</h2><p>${esc(c[1])}</p><p><b>Casting cost:</b> ${esc(c[2])}</p></div>`;
  log(`Hider curse roll: ${c[0]}`)}
$('roll').onclick=()=>{const n=rnd(100),r=DRAW.find(r=>n>=r[0]&&n<=r[1]);
  $('rollOut').innerHTML=`<div style="font:800 40px/1 Rubik,sans-serif">${n}</div><div style="font-size:21px;font-weight:700">${r[2]}</div>`;
  log(`Hider card roll ${n}: ${r[2]}`);if(n>=77)showCurse()};
$('rollC').onclick=showCurse;

$('rulesBody').innerHTML=RULES.map((r,i)=>`<div class="card p3" style="border-left:14px solid ${['#ffc400','#2a6fdb','#d62839','#0f7b5c','#7336d6','#ff9f1c'][i]}"><h2 style="margin:0">${r[0]}</h2><p style="margin-top:6px">${esc(r[1])}</p></div>`).join('')+
 '<p class="sm">Map answers: a "yes" shades everything outside the shape; a "no" shades the shape itself. The clear area is where the hider can still be.</p>';

/* ---------- LOG / TABS ---------- */
function renderLog(){$('logList').innerHTML=S.log.length?S.log.map(l=>`<div class="item"><span><b>${esc(l.t)}</b> &nbsp;${esc(l.x)}</span></div>`).join(''):'<div class="sm">Nothing logged yet.</div>'}
$('logAdd').onclick=()=>{const v=$('logIn').value.trim();if(v){log(v);$('logIn').value=''}};
$('logIn').onkeydown=e=>{if(e.key==='Enter')$('logAdd').click()};
$('logClear').onclick=()=>{if(confirm('Clear the log?')){S.log=[];save();renderLog()}};
$('resetAll').onclick=()=>{if(confirm('Reset the map and log for a new game?')){S.items=[];S.log=[];tmp=[];drawTmp();save();draw();renderItems();renderLog();syncUI()}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  ['map','seek','hide','rules','log'].forEach(t=>$('tab-'+t).classList.toggle('gone',t!==b.dataset.t));
  if(b.dataset.t==='map')setTimeout(()=>map.invalidateSize(),50)});

drawBoundary();draw();renderItems();renderLog();syncUI();
if(!document.querySelector('#presets .on'))$('rCustom').value=(S.r/1609.344).toFixed(2);

</script>
</body>
</html>
